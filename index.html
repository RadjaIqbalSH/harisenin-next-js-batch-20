<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@latest?dev",
        "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
        "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .navbar {
    width: 100%;
    height: 60px;
    background-color: antiquewhite;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    box-sizing: border-box;
  }

  .card {
    width: 150px;
    height: auto;
    padding: 16px;
    background-color: aquamarine;
    border-radius: 16px;
  }
  .card-header {
    border-bottom: 1px solid black;
  }
  .card-body {
    border-bottom: 1px solid black;
  }

  .container {
    width: 100%;
    padding: 80px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    box-sizing: border-box;
  }
</style>
<body>
  <!-- <h1 id="title" style="color: green;">Hallo World</h1> -->
  <div id="app"></div>
  
  <script>
    // const elementTitle = document.getElementById("title");
    // elementTitle.style.color = "red"
    const elementCard = document.createElement("div")
    elementCard.className = "card"
    const elementCardHeader = document.createElement("div")
    elementCard.append(elementCardHeader)
  </script>

  <script type="text/babel" data-type="module" data-presets="react">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
  
    const domNode = document.getElementById('app');
    const root = createRoot(domNode);

    // PascalCase
    // RadjaIqbalSanusiHarahap

    // camelCase
    // radjaIqbalSanusiHarahap

    // kebab-case
    // radja-iqbal-sanusi-harahap

    // snack_case
    // radja_iqbal_sanusi_harahap

    function Navbar () {
      return (
        <nav className="navbar">
          <h1>Logo</h1>
          <div>
            <button>Login</button>
            <button>Sign Up</button>
          </div>
        </nav>
      )
    }

    function Card (props) {

      console.log(props)

      return (
        <div className="card" style={{
          backgroundColor: props.color
        }}>
          <div className="card-header">
            <p>{props.header}</p>
          </div>
          <div className="card-body">
            <p>{props.body}</p>  
          </div>
          <div className="card-footer">
            <p>{props.footer}</p>  
          </div>
        </div>
      )
    }

    const exampleArray = [
      "Card 1", "Card 2", "Card 3", "Card 4", "Card 5"
    ]
    
    root.render(
      <div>
        <Navbar/>
        <div className="container">
          {
            exampleArray.map(function (item) {
              return (
                <Card 
                  header={item}
                  body="Lorem ipsum dolor sit amet, consectetur adipisicing el."
                  footer="Made by me"
                  color="red"
                />
              )
            })
            
          }
          <Card 
            header="Card 6"
            body="Lorem ipsum dolor sit amet, consectetur adipisicing el."
            footer="Made by me"
            color="blue"
          />
        </div>
      </div>
    );

  </script>
</body>
</html>
